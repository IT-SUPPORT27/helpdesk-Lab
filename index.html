<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pelaporan IT & ATK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style> 
        body { background-color: #f4f7f6; padding-top: 50px; padding-bottom: 50px; } 
        .card { border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); } 
        .ticket-card { border: 2px dashed #0d6efd; background-color: #f8f9fa; }
    </style>
</head>
<body>

<div class="container">
    <h2 class="text-center mb-4 text-primary">Portal Pelaporan Kerusakan Lab Komputer</h2>
    <div class="row justify-content-center">
        <div class="col-md-6">
            
            <div class="card p-4" id="formContainer">
                <h4 class="mb-3">Buat Laporan Baru</h4>
                <form id="formPelaporan">
                    <div class="mb-3">
                        <label class="form-label">Nama Pelapor</label>
                        <input type="text" class="form-control" name="nama" required placeholder="Masukkan nama Anda">
                    </div>
                    <div class="mb-3">
                         <label class="form-label">Ruang LAB</label>
                         <select class="form-select" name="ruang_lab" id="ruang_lab" required>
                          <option value="" selected disabled>Memuat pilihan ruangan...</option>
                       </select>
                    </div>
                    <div class="mb-3">
                         <label class="form-label">Nomor PC / Aset</label>
                         <input type="text" class="form-control" name="no_pc" id="no_pc" required placeholder="Contoh: PC-05 atau 05">
                    </div>
                    <div class="mb-3">
                          <label class="form-label">Kategori Kerusakan</label>
                          <select class="form-select" name="kategori" id="kategori" required>
                          <option value="" selected disabled>Memuat pilihan kategori...</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tingkat Prioritas</label>
                        <select class="form-select" name="prioritas" id="prioritas" required>
                            <option value="" selected disabled>Memuat pilihan prioritas...</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Deskripsi Kendala</label>
                        <textarea class="form-control" name="deskripsi" rows="3" required placeholder="Contoh: PC tidak bisa menyala dan berbunyi beep panjang..."></textarea>
                    </div>
                    <button type="submit" id="btnSubmit" class="btn btn-primary w-100 fw-bold">Kirim Laporan</button>
                    <div id="notifikasi" class="alert mt-3 d-none" role="alert"></div>
                </form>
            </div>

            <div class="card p-4 ticket-card d-none" id="ticketContainer">
                <div class="text-center mb-3">
                    <h4 class="text-primary mb-1">🛠️ Bukti Tiket Laporan</h4>
                    <small class="text-muted">Simpan atau screenshot tiket ini untuk ditunjukkan ke Teknisi</small>
                </div>
                <hr>
                <div class="mb-2 d-flex justify-content-between">
                    <span><strong>No. Tiket:</strong></span> <span id="t-id" class="text-primary fw-bold fs-5"></span>
                </div>
                <div class="mb-2 d-flex justify-content-between">
                    <span><strong>Tanggal:</strong></span> <span id="t-tanggal" class="text-end"></span>
                </div>
                <div class="mb-2 d-flex justify-content-between">
                    <span><strong>Nama:</strong></span> <span id="t-nama" class="text-end"></span>
                </div>
                <div class="mb-2 d-flex justify-content-between">
                    <span><strong>Ruangan / PC:</strong></span> <span class="text-end"><span id="t-ruangan"></span> - <span id="t-pc"></span></span>
                </div>
                <div class="mb-2 d-flex justify-content-between">
                    <span><strong>Kategori:</strong></span> <span id="t-kategori" class="text-end"></span>
                </div>
                <div class="mb-2 d-flex justify-content-between">
                    <span><strong>Prioritas:</strong></span> <span id="t-prioritas" class="text-end fw-bold"></span>
                </div>
                <div class="mb-3 mt-3">
                    <strong>Deskripsi Kendala:</strong> 
                    <div class="p-2 bg-white border rounded mt-1 text-muted" id="t-deskripsi" style="font-size: 14px;"></div>
                </div>
                <div class="alert alert-warning text-center p-2 mb-3">
                    Status: <strong>Menunggu Teknisi</strong>
                </div>
                <button class="btn btn-secondary w-100 fw-bold" onclick="resetForm()">Bikin Laporan Baru</button>
            </div>
        </div>
    </div>
</div>

<script>
    const form = document.getElementById('formPelaporan');
    const btnSubmit = document.getElementById('btnSubmit');
    const notifikasi = document.getElementById('notifikasi');
    
    // URL Web App
    const scriptURL ='https://script.google.com/macros/s/AKfycbzCEcq-ifd0hnuIKC_nqoDKARQuUNPE93A7vIpYCr-JOpbLZMUQYvismlQNxl2uOTlh/exec';
    
    document.addEventListener("DOMContentLoaded", function() {
        // FITUR BARU: CEK LOCALSTORAGE SAAT HALAMAN DIMUAT
        const savedTicket = localStorage.getItem('tiketLaporanIT');
        if (savedTicket) {
            const dataTiket = JSON.parse(savedTicket);
            tampilkanTiketKeLayar(dataTiket);
        }

        // Tetap ambil data dropdown dari backend di background
        fetch(scriptURL) 
            .then(response => response.json())
            .then(data => {
                if(data.error) { console.error("Error dari server:", data.error); return; }
                function isiDropdown(idDropdown, arrayData, teksDefault) {
                    const dropdown = document.getElementById(idDropdown);
                    dropdown.innerHTML = `<option value="" selected disabled>${teksDefault}</option>`;
                    arrayData.forEach(item => {
                        let option = document.createElement("option"); option.value = item; option.textContent = item;
                        dropdown.appendChild(option);
                    });
                }
                if(data.ruangan) isiDropdown('ruang_lab', data.ruangan, 'Pilih Ruangan...');
                if(data.kategori) isiDropdown('kategori', data.kategori, 'Pilih Kategori...');
                if(data.prioritas) isiDropdown('prioritas', data.prioritas, 'Pilih Prioritas...');
            })
            .catch(error => console.error('Gagal mengambil data:', error));
    });

    form.addEventListener('submit', e => {
        e.preventDefault();
        
        btnSubmit.innerHTML = 'Mengirim...';
        btnSubmit.disabled = true;
        notifikasi.classList.add('d-none');

        const pilihanLab = document.getElementById('ruang_lab').value.toUpperCase();
        let kodeDepan = "TKT"; 
        
        if (pilihanLab.includes("TJKT")) kodeDepan = "TJKT";
        else if (pilihanLab.includes("DKV")) kodeDepan = "DKV";
        else if (pilihanLab.includes("PM")) kodeDepan = "PM";
        else if (pilihanLab.includes("AKL")) kodeDepan = "AKL";
        else if (pilihanLab.includes("MPLB")) kodeDepan = "MPLB";
        else if (pilihanLab.includes("SMP")) kodeDepan = "SMP";

        const noTiket = kodeDepan + '-' + Math.floor(Math.random() * 900000 + 100000); 
        const now = new Date();
        const tanggalStr = now.toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });

        const formData = new FormData(form);
        formData.append('id_tiket', noTiket); 

        // SIMPAN DATA KE OBJECT UNTUK LOCALSTORAGE
        const dataTiket = {
            id_tiket: noTiket,
            tanggal: tanggalStr,
            nama: formData.get('nama'),
            ruangan: formData.get('ruang_lab'),
            pc: formData.get('no_pc'),
            kategori: formData.get('kategori'),
            prioritas: formData.get('prioritas'),
            deskripsi: formData.get('deskripsi')
        };

        fetch(scriptURL, { method: 'POST', body: formData})
            .then(response => {
                notifikasi.classList.remove('d-none', 'alert-danger');
                notifikasi.classList.add('alert-success');
                notifikasi.innerHTML = '✅ Laporan berhasil terkirim ke tim IT!';
                
                // FITUR BARU: SIMPAN KE MEMORI BROWSER/HP
                localStorage.setItem('tiketLaporanIT', JSON.stringify(dataTiket));

                tampilkanTiketKeLayar(dataTiket);
                
                form.reset();
                btnSubmit.innerHTML = 'Kirim Laporan';
                btnSubmit.disabled = false;
            })
            .catch(error => {
                notifikasi.classList.remove('d-none', 'alert-success');
                notifikasi.classList.add('alert-danger');
                notifikasi.innerHTML = '❌ Gagal mengirim laporan. Periksa koneksi internet Anda.';
                btnSubmit.innerHTML = 'Kirim Laporan';
                btnSubmit.disabled = false;
            });
    });

    // FUNGSI UNTUK MERENDER TAMPILAN TIKET
    function tampilkanTiketKeLayar(data) {
        document.getElementById('t-id').innerText = data.id_tiket;
        document.getElementById('t-tanggal').innerText = data.tanggal;
        document.getElementById('t-nama').innerText = data.nama;
        document.getElementById('t-ruangan').innerText = data.ruangan;
        document.getElementById('t-pc').innerText = data.pc;
        document.getElementById('t-kategori').innerText = data.kategori;
        document.getElementById('t-prioritas').innerText = data.prioritas;
        document.getElementById('t-deskripsi').innerText = data.deskripsi;

        document.getElementById('formContainer').classList.add('d-none');
        document.getElementById('ticketContainer').classList.remove('d-none');
    }

    // FUNGSI UNTUK MENGHAPUS MEMORI TIKET DAN KEMBALI KE FORM
    function resetForm() {
        // FITUR BARU: HAPUS MEMORI TIKET
        localStorage.removeItem('tiketLaporanIT');
        
        document.getElementById('ticketContainer').classList.add('d-none');
        document.getElementById('formContainer').classList.remove('d-none');
        notifikasi.classList.add('d-none');
        form.reset();
    }
</script>

</body>
</html>
