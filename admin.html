<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Helpdesk IT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style> 
        body { background-color: #f4f7f6; padding-top: 30px; padding-bottom: 50px; } 
        .card { border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); } 
        #loginScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #e9ecef; display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .keluhan-text { max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* Efek agar teks catatan terlihat seperti tombol/bisa diklik */
        .catatan-klik { cursor: pointer; color: #0d6efd; font-size: 0.9em; background-color: #f8f9fa; border-radius: 5px; padding: 5px; border: 1px dashed #0d6efd; transition: 0.2s; }
        .catatan-klik:hover { background-color: #e9ecef; color: #0a58ca; }
    </style>
</head>
<body>

<div id="loginScreen">
    <div class="card p-4 shadow-sm" style="width: 100%; max-width: 400px;">
        <h3 class="text-center mb-4">🔒 Login Teknisi</h3>
        <div class="mb-3">
            <label class="form-label">Password Admin</label>
            <input type="password" class="form-control" id="passwordInput" placeholder="Masukkan password...">
        </div>
        <button onclick="cekPassword()" class="btn btn-primary w-100">Masuk</button>
    </div>
</div>

<div class="container-fluid px-4 d-none" id="dashboardScreen">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-dark">🛠️ Dashboard Teknisi</h2>
        <div>
            <button onclick="muatDataLaporan()" class="btn btn-outline-primary me-2">🔄 Refresh Tabel</button>
            <button onclick="logoutAdmin()" class="btn btn-danger">Keluar (Logout)</button>
        </div>
    </div>
    <div class="card p-4">
        <h5 class="mb-3">Daftar Laporan Masuk</h5>
        <div id="loadingText" class="text-center my-4">
            <div class="spinner-border text-primary" role="status"></div><p class="mt-2">Mengambil data...</p>
        </div>
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle d-none" id="tabelLaporan">
                <thead class="table-dark">
                    <tr><th>Waktu</th><th>Ruangan</th><th>Kategori</th><th>Prioritas</th><th>Keluhan</th><th>Catatan Teknisi</th><th>Status</th></tr>
                </thead>
                <tbody id="isiTabel"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const passwordAdmin = "admin123"; 

    // ==========================================
    // MASUKKAN URL WEB APP ANDA DI BAWAH INI
    // ==========================================
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzdpsn9l2BnioaIQcys4OoJ_LPVeEUVhK5hPUBmvk54gbworN8fii8cFBixQ5_0pGvi/exec';

    // Manajemen Login
    document.addEventListener("DOMContentLoaded", function() {
        if (localStorage.getItem("admin_logged_in") === "true") {
            document.getElementById('loginScreen').classList.add('d-none');
            document.getElementById('dashboardScreen').classList.remove('d-none');
            muatDataLaporan();
        }
    });

    function cekPassword() {
        if(document.getElementById('passwordInput').value === passwordAdmin) {
            localStorage.setItem("admin_logged_in", "true");
            document.getElementById('loginScreen').classList.add('d-none');
            document.getElementById('dashboardScreen').classList.remove('d-none');
            muatDataLaporan(); 
        } else { alert('Password salah!'); }
    }

    function logoutAdmin() { localStorage.removeItem("admin_logged_in"); location.reload(); }
    document.getElementById("passwordInput").addEventListener("keypress", function(e) { if(e.key === "Enter") { e.preventDefault(); cekPassword(); } });

    // Memuat Data Laporan
    function muatDataLaporan() {
        document.getElementById('tabelLaporan').classList.add('d-none');
        document.getElementById('loadingText').classList.remove('d-none');
        fetch(scriptURL + "?action=getReports")
            .then(res => res.json())
            .then(data => {
                document.getElementById('loadingText').classList.add('d-none');
                document.getElementById('tabelLaporan').classList.remove('d-none');
                const tbody = document.getElementById('isiTabel');
                tbody.innerHTML = '';
                if(data.length === 0) { tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4">Belum ada laporan masuk.</td></tr>'; return; }
                
                data.forEach(item => {
                    let bgPrioritas = item.prioritas === 'Sedang' ? 'bg-warning text-dark' : (item.prioritas === 'Tinggi' ? 'bg-danger' : 'bg-info text-dark');
                    
                    let statusDropdown = `<select class="form-select form-select-sm status-dropdown" data-row="${item.row}" style="width: 110px;" onchange="updateStatus(this)">`;
                    ['Menunggu', 'Diproses', 'Selesai'].forEach(opsi => {
                        let selected = (item.status === opsi) ? "selected" : "";
                        statusDropdown += `<option value="${opsi}" ${selected}>${opsi}</option>`;
                    });
                    statusDropdown += `</select>`;

                    // Mencegah error karakter kutip pada catatan
                    let safeCatatan = item.catatan ? item.catatan.replace(/'/g, "\\'").replace(/"/g, "&quot;") : ""; 
                    let tampilanCatatan = item.catatan ? item.catatan : "📝 <i>Klik untuk isi penjelasan</i>";

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${item.tanggal}<br><small class="text-muted">${item.nama}</small></td>
                        <td>${item.ruangan}</td>
                        <td>${item.kategori}</td>
                        <td><span class="badge ${bgPrioritas}">${item.prioritas}</span></td>
                        <td class="keluhan-text" title="${item.deskripsi}">${item.deskripsi}</td>
                        <td class="keluhan-text catatan-klik" title="Klik untuk mengubah catatan" onclick="updateCatatan('${item.row}', '${safeCatatan}')">${tampilanCatatan}</td>
                        <td>${statusDropdown}</td>
                    `;
                    tbody.appendChild(tr);
                });
            }).catch(err => { document.getElementById('loadingText').innerHTML = '<span class="text-danger">Gagal memuat data. Periksa koneksi.</span>'; });
    }

    // Mengubah Status
    function updateStatus(selectElement) {
        const row = selectElement.getAttribute('data-row');
        const statusBaru = selectElement.value;
        selectElement.disabled = true;
        const warnaAsli = selectElement.style.backgroundColor;
        selectElement.style.backgroundColor = "#e9ecef";

        const formData = new FormData();
        formData.append('action', 'updateStatus'); formData.append('row', row); formData.append('status', statusBaru);

        fetch(scriptURL, { method: 'POST', body: formData })
            .then(res => res.text())
            .then(result => {
                selectElement.disabled = false;
                selectElement.style.backgroundColor = statusBaru === 'Selesai' ? '#d1e7dd' : (statusBaru === 'Diproses' ? '#fff3cd' : '#f8d7da');
            }).catch(err => { alert('Gagal mengupdate status.'); selectElement.disabled = false; selectElement.style.backgroundColor = warnaAsli; });
    }

    // Mengubah Catatan Teknisi
    function updateCatatan(row, catatanLama) {
        // Memunculkan kotak dialog input
        let catatanBaru = prompt("Masukkan Penjelasan Kerusakan / Catatan Perbaikan Teknisi:", catatanLama);
        
        // Memastikan teknisi tidak menekan cancel dan isinya tidak kosong
        if (catatanBaru !== null) {
            
            document.getElementById('tabelLaporan').classList.add('d-none');
            document.getElementById('loadingText').classList.remove('d-none');
            document.querySelector('#loadingText p').innerText = "Menyimpan catatan ke database...";

            const formData = new FormData();
            formData.append('action', 'updateCatatan'); 
            formData.append('row', row); 
            formData.append('catatan', catatanBaru);

            fetch(scriptURL, { method: 'POST', body: formData })
                .then(res => res.text())
                .then(result => {
                    document.querySelector('#loadingText p').innerText = "Mengambil data terbaru...";
                    muatDataLaporan(); // Otomatis refresh tabel
                }).catch(err => { 
                    alert('Gagal menyimpan catatan. Silakan periksa koneksi internet Anda.'); 
                    muatDataLaporan();
                });
        }
    }
</script>
</body>
</html>
